name: DSR validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/dsr-rule-validation]
jobs:
  dsr-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run DSR unit tests
        run: node --test tests/dsr-*.test.mjs
